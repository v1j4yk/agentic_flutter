name: agentic_llm
description: >-
  Provider-independent large language model access for the agentic framework:
  streaming, tool calling, structured output, embeddings, cost accounting and
  composable middleware, with adapters for OpenAI-compatible APIs, Anthropic
  and Google Gemini.
version: 0.1.0
repository: https://github.com/v1j4yk/agentic_flutter
issue_tracker: https://github.com/v1j4yk/agentic_flutter/issues
documentation: https://github.com/v1j4yk/agentic_flutter/blob/main/packages/agentic_llm/README.md
topics:
  - ai
  - llm
  - openai
  - anthropic
  - agentic

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  agentic_core: ^0.1.0
  # The tool vocabulary is not optional for a modern model abstraction: a
  # `ChatRequest` has to be able to carry the tools the model may call. This
  # dependency points strictly downward — `agentic_tools` knows nothing about
  # models — so the layering stays acyclic.
  agentic_tools: ^0.1.0
  http: ^1.6.0
  # Floored at what we actually use (`@immutable`, `@protected`,
  # `@visibleForTesting`) rather than at the newest release. The Flutter SDK
  # pins `meta` to the version it ships, so a tighter floor here would make the
  # package unusable from a Flutter app — which is the one thing it must not be.
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
