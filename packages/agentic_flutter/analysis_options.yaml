# `agentic_flutter` keeps the repository-wide contract and adds the Flutter
# rules on top. The include order matters: `flutter_lints` comes second so its
# widget-specific rules are additive rather than a replacement for the strict
# analyzer settings every other package is held to.
include: ../../analysis_options.yaml

linter:
  rules:
    # Flutter-specific rules the shared contract has no reason to know about.
    use_key_in_widget_constructors: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true
    prefer_const_constructors_in_immutables: true
    no_logic_in_create_state: true
    use_build_context_synchronously: true
