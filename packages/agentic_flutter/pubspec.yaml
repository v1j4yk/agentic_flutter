name: agentic_flutter
description: >-
  Flutter bindings for the agentic AI framework: the umbrella package apps
  depend on, a lifecycle-bound runtime, device tools, secret storage and
  chat widgets.
version: 0.1.1
repository: https://github.com/v1j4yk/agentic_flutter
issue_tracker: https://github.com/v1j4yk/agentic_flutter/issues
documentation: https://github.com/v1j4yk/agentic_flutter/blob/main/packages/agentic_flutter/README.md
topics:
  - ai
  - agents
  - llm
  - flutter
  - agentic

# Taken from a project generated by `create_agentic_app`, running against a
# real Gemini 2.5 Flash key on a Pixel 9a — not mock-ups. What the template
# produces is what these show, which is the only way a screenshot is worth
# putting on a package page.
screenshots:
  - description: >-
      A chat screen built from AgentChatView, with suggestions that show what
      the agent can do before anyone has typed anything.
    path: doc/screenshots/01-chat.png
  - description: >-
      Three turns and three tool calls. Every answer carries a chip naming the
      tool that produced it, so a surprising reply can be traced to its source.
    path: doc/screenshots/02-tools.png
  - description: >-
      Human approval before a tool that changes something runs, showing the
      exact arguments the model proposed and that the tool is not read-only.
    path: doc/screenshots/03-approval.png
  - description: >-
      The trace inspector: every event the run published, correlated by run and
      trace id, on the device rather than in a log somewhere else.
    path: doc/screenshots/04-trace.png

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  agentic_agents: ^0.1.0
  agentic_core: ^0.1.0
  agentic_llm: ^0.1.0
  agentic_mcp: ^0.1.0
  agentic_memory: ^0.1.0
  agentic_rag: ^0.1.0
  agentic_tools: ^0.1.0
  agentic_vector: ^0.1.0
  agentic_workflow: ^0.1.0
  flutter:
    sdk: flutter
  # Floored at what we actually use (`@immutable`, `@protected`,
  # `@visibleForTesting`) rather than at the newest release. The Flutter SDK
  # pins `meta` to the version it ships, so a tighter floor here would make the
  # package unusable from a Flutter app — which is the one thing it must not be.
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
