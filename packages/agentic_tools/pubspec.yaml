name: agentic_tools
description: >-
  Tool and function-calling layer for the agentic framework: a typed tool
  contract, JSON Schema argument validation, a tool registry with namespacing,
  permission gating, timeouts and structured results. Pure Dart.
version: 0.1.0
repository: https://github.com/v1j4yk/agentic_flutter
issue_tracker: https://github.com/v1j4yk/agentic_flutter/issues
documentation: https://github.com/v1j4yk/agentic_flutter/blob/main/packages/agentic_tools/README.md
topics:
  - ai
  - agents
  - llm
  - tools
  - agentic

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  agentic_core: ^0.1.0
  # Floored at what we actually use (`@immutable`, `@protected`,
  # `@visibleForTesting`) rather than at the newest release. The Flutter SDK
  # pins `meta` to the version it ships, so a tighter floor here would make the
  # package unusable from a Flutter app — which is the one thing it must not be.
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
