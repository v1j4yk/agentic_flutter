name: agentic_tools_generator
description: >-
  Generates agentic_tools tools from annotated Dart functions: the JSON
  schema, argument reading and result conversion, checked at build time.
version: 0.1.2
repository: https://github.com/v1j4yk/agentic_flutter
issue_tracker: https://github.com/v1j4yk/agentic_flutter/issues
documentation: https://github.com/v1j4yk/agentic_flutter/blob/main/packages/agentic_tools_generator/README.md
topics:
  - ai
  - agents
  - codegen
  - build-runner
  - agentic

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  analyzer: ^14.1.0
  build: ^4.0.9
  source_gen: ^4.3.0

dev_dependencies:
  agentic_core: ^0.1.0
  agentic_tools: ^0.1.0
  build_runner: ^2.16.1
  build_test: ^3.5.20
  lints: ^6.1.0
  test: ^1.31.2
