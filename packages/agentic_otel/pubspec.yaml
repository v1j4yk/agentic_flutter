name: agentic_otel
description: >-
  OpenTelemetry export for the agentic framework: agent, model and tool spans
  sent over OTLP to any backend, with the GenAI semantic conventions.
version: 0.3.1
repository: https://github.com/v1j4yk/agentic_flutter
issue_tracker: https://github.com/v1j4yk/agentic_flutter/issues
documentation: https://github.com/v1j4yk/agentic_flutter/blob/main/packages/agentic_otel/README.md
topics:
  - ai
  - agents
  - opentelemetry
  - observability
  - agentic

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  agentic_core: ^0.3.0
  # OTLP over HTTP with a JSON body: no protobuf dependency, no code
  # generation, and every collector accepts it. The binary encoding is smaller
  # on the wire, which matters for a fleet of servers and not for one phone.
  http: ^1.6.0
  # Floored at what the Flutter SDK pins, like every sibling package.
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
