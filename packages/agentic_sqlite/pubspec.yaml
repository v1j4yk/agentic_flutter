name: agentic_sqlite
description: >-
  On-device persistence for the agentic framework: SQLite-backed vector and
  memory stores that survive restarts, with the in-memory search behind them.
version: 0.2.0
repository: https://github.com/v1j4yk/agentic_flutter
issue_tracker: https://github.com/v1j4yk/agentic_flutter/issues
documentation: https://github.com/v1j4yk/agentic_flutter/blob/main/packages/agentic_sqlite/README.md
topics:
  - ai
  - agents
  - sqlite
  - vector-database
  - agentic

environment:
  sdk: ^3.11.0

resolution: workspace

# Web is not supported: package:sqlite3 on the web needs a WASM build and an
# asynchronous VFS, which is a different adapter rather than a flag on this one.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  agentic_agents: ^0.2.0
  agentic_core: ^0.2.0
  agentic_memory: ^0.2.0
  agentic_vector: ^0.2.0
  agentic_workflow: ^0.2.0
  # Floored at what the Flutter SDK pins, like every sibling package.
  meta: ^1.16.0
  # 3.x bundles SQLite through a build hook, on the Dart VM and in Flutter
  # alike, which is what lets this package be tested without a device.
  # `sqlite3_flutter_libs` is end-of-life for exactly that reason.
  sqlite3: ^3.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
