name: release

on:
  push:
    tags:
      - "agentic_*-v*"

# Publishing uses pub.dev's OIDC automated publishing: no long-lived
# credentials are stored in the repository.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Derive package directory from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG%%-v*}"
          echo "dir=packages/${NAME}" >> "$GITHUB_OUTPUT"
      - name: Publish
        run: dart pub publish --force
        working-directory: ${{ steps.pkg.outputs.dir }}
